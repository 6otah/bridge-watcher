[package]
name = "bridge-watcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Read-only watcher for Circle CCTP V2 USDC transfers between Solana and Base"
license = "MIT"
repository = "https://github.com/6otah/bridge-watcher"
readme = "README.md"
keywords = ["cctp", "bridge", "solana", "base", "indexer"]
categories = ["cryptography::cryptocurrencies", "command-line-utilities"]

[dependencies]
alloy = { version = "2.6", default-features = false, features = ["std", "provider-http", "rpc-types-eth", "sol-types", "reqwest-rustls-tls"] }
anyhow = "1"
borsh = { version = "1.8", features = ["derive"] }
bs58 = "0.5"
clap = { version = "4.6", features = ["derive", "env"] }
dotenvy = "0.15"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "time", "signal", "sync"] }
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.54", features = ["test-util"] }

[profile.dev.package."*"]
opt-level = 1
